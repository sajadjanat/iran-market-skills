name: Skill problem
description: Report a reproducible issue in one of the five skills.
body:
  - type: input
    id: skill
    attributes:
      label: Skill and installed revision
      placeholder: persian-rtl-ux, commit or package version
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and environment
      description: Agent/model, available tools, platform and anonymized input.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual result
      description: Include reproducible evidence and access limitations; remove personal data and credentials.
    validations:
      required: true
