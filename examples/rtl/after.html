<!doctype html>

<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرم تماس نمونه</title>
<style>
body { font-family: sans-serif; max-inline-size: 42rem; margin: 2rem auto; padding-inline: 1rem; }
label { display: block; margin-block-end: .5rem; }
input { margin-inline-end: 1rem; max-inline-size: 100%; box-sizing: border-box; }
button, input { font: inherit; padding: .5rem; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-block-start: 1rem; }
:focus-visible { outline: 3px solid #0b57d0; outline-offset: 3px; }
</style>
</head>
<body>
<h1>پیگیری سفارش</h1>
<p>شناسهٔ سفارش: <bdi dir="ltr">AB-123/45</bdi></p>
<label for="phone">شمارهٔ تماس</label>
<input id="phone" name="phone" type="tel" dir="ltr" autocomplete="tel" placeholder="+98 912 000 0000">
<div class="actions"><button type="button">بررسی درخواست</button></div>
<p>این صفحه فقط نمونهٔ نمایشی است؛ دکمه به سرویس متصل نیست.</p>
</body>
</html>
